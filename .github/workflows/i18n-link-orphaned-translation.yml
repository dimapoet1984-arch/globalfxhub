name: i18n link orphaned translation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (check only) or execute (link page 66 -> es:746)"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - execute

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Run link repair
        env:
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python3 i18n/link_orphaned_translation.py --mode ${{ inputs.mode }}

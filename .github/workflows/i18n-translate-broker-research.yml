name: i18n translate broker research

on:
  workflow_dispatch:
    inputs:
      keys:
        description: "Comma-separated article keys to translate (blank = all)"
        required: false
        default: ""

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests anthropic
      - name: Translate broker research articles
        env:
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
        run: |
          python3 i18n/translate_broker_research.py --keys "${{ github.event.inputs.keys }}"

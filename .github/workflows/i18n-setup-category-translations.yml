name: i18n setup category translations

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (report only) or apply"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - apply

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Run category translation setup
        env:
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python3 i18n/setup_category_translations.py \
            ${{ inputs.mode == 'dry-run' && '--dry-run' || '' }}

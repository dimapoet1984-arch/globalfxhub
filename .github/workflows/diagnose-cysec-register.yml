name: diagnose cysec register page structure

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Plain curl (known to return a real 200 + full page previously)
        run: |
          curl -sSL -A "Mozilla/5.0 (compatible; GlobalFXHubRegistryCheck/1.0)" \
            -w "\n\nHTTP %{http_code}\n" \
            "https://www.cysec.gov.cy/en-GB/entities/investment-firms/cypriot/" \
            -o /tmp/cysec.html
          echo "--- byte size ---"
          wc -c /tmp/cysec.html
          echo "--- does this response look like a WAF block page? ---"
          grep -i "web page blocked\|attack id" /tmp/cysec.html || echo "no block-page markers found -- looks like a real response"
          echo "--- any fetch()/XHR/ajax/api hints in the JS ---"
          grep -ioE '(fetch\(|XMLHttpRequest|\.ajax\(|/api/[a-z0-9/_-]*|\.asmx[a-z0-9/_?=&-]*|/_vti_bin/[a-z0-9/_-]*|webmethod)' /tmp/cysec.html | sort -u | head -40
          echo "--- any data-* attributes that might hint at a widget/component name ---"
          grep -ioE 'data-[a-z-]+="[^"]{0,60}"' /tmp/cysec.html | sort -u | head -30
          echo "--- any <script> src referencing something other than known CDNs (jquery/bootstrap/aos/fancybox/owlcarousel/cdnjs/jsdelivr/unpkg/googleapis) ---"
          grep -oE '<script[^>]*src="[^"]*"' /tmp/cysec.html | grep -viE 'jquery|bootstrap|aos|fancybox|owl.carousel|cdnjs|jsdelivr|unpkg|googleapis|gstatic' | sort -u | head -20
          echo "--- look for a specific content container near where a results grid might render (search for common CMS widget markers) ---"
          grep -oE 'id="[a-zA-Z0-9_]*[Rr]esult[a-zA-Z0-9_]*"|id="[a-zA-Z0-9_]*[Gg]rid[a-zA-Z0-9_]*"|id="[a-zA-Z0-9_]*[Ll]ist[a-zA-Z0-9_]*"' /tmp/cysec.html | sort -u | head -20

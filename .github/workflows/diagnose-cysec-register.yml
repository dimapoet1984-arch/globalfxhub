name: diagnose cysec register page structure

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the CySEC CIF register page and inspect its structure
        run: |
          curl -sSL -A "Mozilla/5.0 (compatible; GlobalFXHubRegistryCheck/1.0)" \
            -w "\n\nHTTP %{http_code}\n" \
            "https://www.cysec.gov.cy/en-GB/entities/investment-firms/cypriot/" \
            -o /tmp/cysec.html
          echo "--- byte size ---"
          wc -c /tmp/cysec.html
          echo "--- first 3000 chars ---"
          head -c 3000 /tmp/cysec.html
          echo
          echo "--- grep for a few known license numbers ---"
          grep -o '.\{80\}309/16.\{80\}' /tmp/cysec.html || echo "309/16 not found"
          grep -o '.\{80\}400/21.\{80\}' /tmp/cysec.html || echo "400/21 not found"
          grep -o '.\{80\}125/10.\{80\}' /tmp/cysec.html || echo "125/10 not found"
          echo "--- any xlsx/csv/pdf download links ---"
          grep -oE 'href="[^"]*\.(xlsx|csv|pdf)"' /tmp/cysec.html | head -10 || echo "none found"
          echo "--- rough count of license-number-shaped strings (NNN/NN) ---"
          grep -oE '[0-9]{2,3}/[0-9]{2}' /tmp/cysec.html | sort -u | wc -l

name: diagnose candidate central bank RSS feeds

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check candidate feed URLs
        run: |
          check() {
            echo "--- $1 ---"
            curl -sSL -A "Mozilla/5.0 (compatible; GlobalFXHubFeedCheck/1.0)" -o /tmp/feed.xml -w "HTTP %{http_code}\n" "$1"
            echo "byte size: $(wc -c < /tmp/feed.xml)"
            head -c 600 /tmp/feed.xml
            echo
            echo "item count: $(grep -c '<item>' /tmp/feed.xml || echo 0)"
            echo
          }
          check "https://www.federalreserve.gov/feeds/press_other.xml"
          check "https://www.federalreserve.gov/feeds/press_monetary.xml"
          check "https://www.federalreserve.gov/feeds/press_enforcement.xml"
          check "https://www.federalreserve.gov/feeds/press_bcreg.xml"
          check "https://www.federalreserve.gov/feeds/press_all.xml"
          check "https://www.ecb.europa.eu/rss/press.xml"

name: i18n repair news pt es collision

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (report only) or apply"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - apply

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests anthropic
      - name: Run the targeted repair
        env:
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python3 i18n/repair_news_pt_es_collision.py \
            ${{ inputs.mode == 'dry-run' && '--dry-run' || '' }}

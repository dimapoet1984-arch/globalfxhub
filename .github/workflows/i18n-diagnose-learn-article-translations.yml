name: i18n diagnose learn article translations

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "Comma-separated English post slugs to look up"
        required: true
        default: "asic-forex-regulation-explained,fsca-forex-regulation-explained"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Run diagnostic (read-only)
        env:
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python3 i18n/diagnose_learn_article_translations.py --slugs "${{ inputs.slugs }}"

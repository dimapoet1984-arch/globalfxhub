name: i18n trash duplicate mistagged posts

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (report only) or execute"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - execute

jobs:
  trash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests anthropic
      - name: Trash the 7 duplicate mistagged posts
        env:
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python3 i18n/trash_duplicate_mistagged_posts.py --mode ${{ inputs.mode }}
